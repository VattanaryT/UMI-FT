# Fix B r4: r2 obs + Fix B (v_par, δn) + learned ΔR = R(x_s)^T R_tool (rot6d).
# Same observations / val split (seed=42, val_ratio=0.1) / horizons as r2;
# only action dim changes (21 → 27). Train like r2:
#   RUN=r4_world_fixb_tilt sbatch fixb_train_scanner_klone.sbatch
# Eval matched ckpt at epoch 35.
#
# Chunks: identical to r2 (UmiFTDatasetR4 does not drop queries).
# Loss: mask ΔR dims (21:27) after a field-frame jump within the chunk.
# Action normalizer: dims 0:21 are the r2 job-41907426 fit (not refit on r4).
# Today's sampler drops the δn=0.989 m peak (it sits in a scan pause); refitting
# would pin δn max at 0.318. Dims 21:27 stay identity.
defaults:
  - umift_mold_aware
  - _self_

name: SCANNER-FIXB-R4-WORLD-FIXB-TILT

dataset_path: /mnt/data/umidata/ft/mold_aware_datasets/stringer_scanner_v2_fixb/r4_world_fixb_tilt/acp_replay_buffer.zarr

dataset:
  _target_: fixb_dataset.UmiFTDatasetR4
  mask_delta_R_after_field_jumps: true
  field_jump_deg: 30.0
  # Optional; on Hyak override to a writable path (e.g. /checkpoints/...).
  # Default null so a geodude-only path cannot crash train on a RO mount.
  filter_stats_path: null
  # Oct 16 r2 fit. Hyak sbatch overrides this to the /opt/umift copy of the same file.
  r2_action_normalizer_path: /home/boeing/umi_ft_ws/worktrees/UMI-FT-surface_frames/UMIFT_Data/surface_frames_scripts/assets/r2_sparse_normalizer_41907426.pkl

shape_meta:
  action:
    shape: [27]
    rotation_rep: rotation_6d
  raw:
    fixb_delta_R_rot6d_0:
      shape: [6]
      type: low_dim
