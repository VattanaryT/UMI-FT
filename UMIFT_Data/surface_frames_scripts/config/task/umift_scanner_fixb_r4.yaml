# Fix B r4: r2 obs + Fix B (v_par, δn) + learned ΔR = R(x_s)^T R_tool (rot6d).
# Same observations / val split (seed=42, val_ratio=0.1) / horizons as r2;
# only action dim changes (21 → 27). Train like r2:
#   RUN=r4_world_fixb_tilt sbatch fixb_train_scanner_klone.sbatch
# Eval matched ckpt at epoch 35.
#
# r4-only sampler filter (UmiFTDatasetR4): drop chunks with off-edge at k0
# (in-plane > 5 mm) OR any field-frame jump > 30° inside the action window.
defaults:
  - umift_mold_aware
  - _self_

name: SCANNER-FIXB-R4-WORLD-FIXB-TILT

dataset_path: /mnt/data/umidata/ft/mold_aware_datasets/stringer_scanner_v2_fixb/r4_world_fixb_tilt/acp_replay_buffer.zarr

dataset:
  _target_: fixb_dataset.UmiFTDatasetR4
  drop_off_edge_and_field_jumps: true
  off_edge_m: 0.005
  field_jump_deg: 30.0
  # Written at dataset init (also printed to training log).
  filter_stats_path: /mnt/data/umidata/ft/mold_aware_datasets/stringer_scanner_v2_fixb/r4_world_fixb_tilt/checks/r4_chunk_filter_stats.json

shape_meta:
  action:
    shape: [27]
    rotation_rep: rotation_6d
  raw:
    fixb_delta_R_rot6d_0:
      shape: [6]
      type: low_dim
